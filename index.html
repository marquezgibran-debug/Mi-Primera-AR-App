<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Configuración del viewport -->
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Mi Primera App AR - Análisis de Tecnologías Emergentes</title>

    <!-- Importación de A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- Importación de AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden; font-family: sans-serif;">

    <!-- embedded quita los estilos de pantalla completa para ajustarse a la web -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- a-marker define qué patrón debe buscar la cámara -->
        <!-- preset="hiro" indica que busque el marcador "Hiro" -->
        <a-marker preset="hiro">

            <!-- Este a-box es el objeto 3D que aparecerá SOBRE el marcador -->
            <a-box position="0 0.5 0" color="#4CC3D9" material="opacity: 0.8"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
            </a-box>

        </a-marker>

        <!-- a-entity camera son como los ojos del usuario -->
        <a-entity camera></a-entity>

    </a-scene>

</body>

</html>
